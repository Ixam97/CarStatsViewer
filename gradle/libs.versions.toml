[versions]
agp = "9.1.1"
kotlin = "2.4.0"
ktx = "1.19.0"
activity = "1.13.0"
recyclerview = "1.4.0"
room = "2.8.4"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
lifecycle = "2.10.0"
navigation = "2.9.8"
car-app = "1.8.0-beta01"
gson = "2.14.0"
gms-location = "21.3.0"
kotlinx = "1.11.0"
serialization = "1.11.0"
composeBom = "2026.05.01"
aboutlibraries = "14.2.1"
paris = "2.2.1"
leakcanary = "2.14"
google-services = "4.4.4"
firebase-crashlytics = "3.0.7"
firebase-bom = "34.14.0"
retrofit = "3.0.0"
okhttp3 = "5.3.2"
window = "1.5.1"
nav3Core = "1.1.2"
carcompose = "78c184f7"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-car-app = {group = "androidx.car.app", name = "app", version.ref = "car-app"}
androidx-car-app-automotive = {group = "androidx.car.app", name = "app-automotive", version.ref = "car-app"}
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group="androidx.activity", name = "activity-compose", version.ref = "activity"}
androidx-compose-ui = { group="androidx.compose.ui", name = "ui" }
androidx-compose-material = { group="androidx.compose.material", name = "material" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name="adaptive" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation"}
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle"}
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle"}
androidx-room = { group = "androidx.room", name = "room-ktx", version.ref = "room"}
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room"}
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit"}
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit"}
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3"}

google-gson = { group = "com.google.code.gson", name ="gson", version.ref = "gson" }
google-gms-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "gms-location"}
google-firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom"}
google-firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics"}
google-firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics"}

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx"}
kotlinx-coroutines-play-services = {group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx"}
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization"}
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutlibraries" }
airbnb-paris = { group = "com.airbnb.android", name = "paris", version.ref = "paris"}
github-egm96 = { group = "com.github.matthiaszimmermann", name = "EGM96", version = "master-SNAPSHOT"}
github-scrollbar = {group = "com.github.nanihadesuka", name = "LazyColumnScrollbar", version = "2.2.0"}
github-carcompose = {group = "com.github.ixam97", name = "CarCompose", version.ref = "carcompose"}

squareup-leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary"}

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinSerialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries"}
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services"}
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics"}
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize",  version.ref = "kotlin"  }
google-ksp = { id = "com.google.devtools.ksp", version = "2.3.4"}